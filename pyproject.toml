[project]
name = "cookidoo"
version = "0.1.0"
description = "Unofficial comprehensive async Python SDK for the Cookidoo (Thermomix) mobile API, reverse-engineered from the Android app."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["cookidoo", "thermomix", "vorwerk", "recipes", "api", "sdk"]
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cookidoo"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-pretty>=1.3",
    "dirty-equals>=0.9",
    "coverage[toml]>=7.6",
]
lint = [
    "pyright>=1.1",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "C90",
    "UP",
    "I",
    "D",
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D100",
    "D102",
    "D104",
    "D105",
    "D107",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["cookidoo"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
# scripts/ are exploratory research helpers, not shipped code
"scripts/**/*.py" = ["D", "UP031", "DTZ011"]
"examples/**/*.py" = ["D"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnnecessaryTypeIgnoreComment = true
reportMissingModuleSource = false
reportPrivateUsage = false
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
executionEnvironments = [
    { root = "tests", reportUnknownMemberType = false, reportUnknownVariableType = false, reportUnknownArgumentType = false, reportPrivateUsage = false },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["cookidoo"]
branch = true

[tool.coverage.report]
# Offline tests only exercise the pure-logic layers (models, hal, localization);
# client/auth/resources need the live network and are covered by scripts/*.
fail_under = 40
show_missing = true
skip_covered = true
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    '@overload',
    '@abstractmethod',
]
